name: CI/CD Pipeline - CineLog

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.12.4"

jobs:
  # ========================================
  # INTEGRAÇÃO CONTÍNUA (CI)
  # ========================================

  ci:
    name: Testes (CI)
    runs-on: ubuntu-latest

    steps:
      # Clonar repositório (necessário para acessar código e rodar testes)
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      # Configurar Node.js v24.16.0 (garante compatibilidade com pnpm e Vite)
      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Ativar pnpm via Corepack (garante que a versão do pnpm seja consistente)
      - name: Ativar pnpm via Corepack
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      # Scripts de instalação são permitidos neste pipeline
      # porque dependências como Cypress exigem instalação
      # de componentes adicionais após o download.
      # As dependências são controladas via pnpm-lock.yaml.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Cache do binário Cypress
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('frontend/package.json') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      # Build do frontend (para garantir que não quebre, e para testes E2E)
      - name: Build frontend
        working-directory: ./frontend
        run: pnpm run build
        continue-on-error: false

      # Iniciar servidor Vite em background (para testes E2E)
      - name: Iniciar servidor frontend (Vite)
        working-directory: ./frontend
        run: |
          nohup pnpm run dev > /tmp/vite.log 2>&1 &
          echo "Aguardando servidor iniciar..."
          for i in {1..60}; do
            if curl -s http://localhost:5173/pages/home.html > /dev/null 2>&1; then
              echo "Servidor rodando em http://localhost:5173/pages/home.html"
              sleep 2
              exit 0
            fi
            echo "Tentativa $i/60..."
            sleep 1
          done
          echo "Servidor não respondeu"
          cat /tmp/vite.log
          exit 1

      # Instala explicitamente o binário do Cypress.
      # Execução necessária para os testes E2E do pipeline.
      - name: Instalar Cypress binary
        working-directory: ./frontend
        run: pnpm exec cypress install

      # Rodar Cypress (testes E2E com fixtures, SEM API real)
      - name: Rodar Cypress (Testes E2E)
        working-directory: ./frontend
        run: pnpm run test:ci
        env:
          CYPRESS_baseUrl: http://localhost:5173

      # Upload screenshots (se falhar)
      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ github.run_number }}
          path: frontend/cypress/screenshots/
          retention-days: 7

      # Upload videos (se falhar)
      - name: Upload Cypress videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ github.run_number }}
          path: frontend/cypress/videos/
          retention-days: 7

      # Upload logs do servidor (se falhar)
      - name: Upload server logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ github.run_number }}
          path: /tmp/vite.log
          retention-days: 7

  # ========================================
  # ENTREGA CONTÍNUA (CD)
  # ========================================

  cd:
    name: Deploy (CD)
    runs-on: ubuntu-latest
    needs: ci
    # Rodar apenas se: CI passou E está em dev ou main
    if: success() && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: CI passou! Preparando deploy
        run: |
          echo "CI passou com sucesso!"
          echo "Vercel e Render farão deploy automático"
          echo ""
          echo "Frontend:"
          echo "https://seu-frontend.vercel.app"
          echo ""
          echo "Backend:"
          echo "https://seu-backend.onrender.com"

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: cinelogplay-frontend

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules

    environment:
      - CHOKIDAR_USEPOLLING=true
      - CI=true

    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: cinelogplay-backend

    ports:
      - "3001:3001"

    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules

    environment:
      - CI=true
      # Conexão com o banco DENTRO do Docker: DB_HOST é o NOME do serviço
      # ("postgres"), resolvido pela rede interna do compose — NÃO "localhost"
      # (que dentro do container seria o próprio backend). Sem estas variáveis
      # o backend não alcança o Postgres e cai no modo mock.
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=cinelogplay
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173,http://localhost:5174

depends_on:
  postgres:
    condition: service_healthy

  postgres:
    image: postgres:16-alpine

    container_name: cinelogplay-postgres

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cinelogplay

    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Healthcheck: o backend só inicia quando o Postgres estiver pronto para
    # aceitar conexões (evita corrida de inicialização / ENOTFOUND no boot).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinelogplay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  backend_node_modules:
  frontend_node_modules:

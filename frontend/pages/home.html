<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home - CinelogPlay</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
  </head>

  <body>
    <nav class="navbar-custom">
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">
        <i class="bi bi-list"></i>
      </button>

      <a class="navbar-brand" href="/pages/home.html">
        <img src="/cinelogplay.png" alt="CinelogPlay" title="CinelogPlay" />
      </a>

      <div class="user-profile-wrapper">
        <button class="user-profile" id="userProfileBtn">
          <div class="user-avatar" id="userAvatar">L</div>

          <div class="user-info">
            <span class="user-name" id="userName"> Lucas </span>

            <span class="user-email" id="userEmail"> lucas@email.com </span>
          </div>
        </button>

        <div class="user-dropdown" id="userDropdown">
          <a href="#" id="profileLink">
            <i class="bi bi-person"></i>
            Perfil
          </a>

          <a href="#" id="logoutLink" class="logout">
            <i class="bi bi-box-arrow-right"></i>
            Sair
          </a>
        </div>
      </div>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar">
      <nav>
        <ul class="sidebar-nav">
          <li>
            <a href="/pages/home.html" class="nav-link active">
              <i class="bi bi-house-door"></i>
              Home
            </a>
          </li>

          <li>
            <a href="/pages/filmes.html" class="nav-link">
              <i class="bi bi-film"></i>
              Filmes
            </a>
          </li>

          <li>
            <a href="/pages/diretores.html" class="nav-link">
              <i class="bi bi-person-circle"></i>
              Diretores
            </a>
          </li>

          <li>
            <a href="/pages/contato.html" class="nav-link">
              <i class="bi bi-envelope"></i>
              Contato
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <div id="app">
      <div
        class="container-fluid d-flex align-items-center justify-content-center"
        style="min-height: calc(100vh - 80px)"
      >
        <div class="text-center">
          <h1
            style="
              font-size: 2.5rem;
              color: #333;
              font-weight: 300;
              letter-spacing: 1px;
              margin-bottom: 1.5rem;
            "
          >
            🎬 CinelogPlay
          </h1>

          <p style="font-size: 1.1rem; color: #999; margin-bottom: 0.5rem">
            Catálogo Informativo de Produções Cinematográficas
          </p>

          <p style="font-size: 1rem; color: #aaa">
            Bem-vindo ao seu diário de bordo do cinema!
          </p>
        </div>
      </div>

      <div id="filmes-container"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>

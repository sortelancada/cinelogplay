<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CinelogPlay</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <body>
    <div
      class="d-flex align-items-center justify-content-center"
      style="min-height: 100vh; background: var(--color-bg)"
    >
      <div class="text-center p-4" style="max-width: 400px">
        <img
          src="/logo/cinelogplay.png"
          alt="CinelogPlay"
          style="max-height: 60px; margin-bottom: 2rem"
        />
        <h1 class="h4 mb-4" style="color: var(--color-text-dark)">Login</h1>

        <form id="login-form" novalidate>
          <div class="mb-3 text-start">
            <label for="login-email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="login-email"
              required
            />
          </div>

          <div class="mb-3 text-start">
            <label for="login-senha" class="form-label">Senha</label>
            <input
              type="password"
              class="form-control"
              id="login-senha"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">
            Entrar
          </button>
        </form>

        <p class="text-muted small mb-3">Ou continue como visitante</p>
        <a href="/pages/home.html" class="btn btn-outline-secondary w-100">
          ← Voltar à Home
        </a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/src/js/login.js"></script>
  </body>
</html>
